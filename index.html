main{position:relative;max-width:460px;margin:0 auto;padding:30px 20px calc(36px + env(safe-area-inset-bottom))}
.logo{display:block;width:min(62%,240px);height:auto;margin:0 auto}

.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.ic svg{width:32px;height:32px}
.tx{flex:1;display:flex;flex-direction:column;min-width:0}
.lb{font-size:14px;font-weight:500;color:var(--camel)}
.vl{font-size:18px;font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{flex:none;width:22px;height:22px}

.sp{position:absolute;width:18px;height:18px}
.s1{top:34px;right:22px}.s2{top:110px;left:20px;width:15px}.s3{top:262px;right:30px;width:13px}
